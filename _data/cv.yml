- title: Technical Expertise
  type: nested_list
  contents:
    - title: Systems neuroscience
      items:
        - "In vivo high-density electrophysiology: chronic eight-probe Neuropixels implants in freely-moving rats, acute recordings in behaving mice, Neuropixels 1.0 and 2.0 testing (Neuropixels consortium)"
        - Optogenetics, pharmacology, rodent behaviour (surgery, training, analysis)
        - Electronics and signal synchronization for electrophysiology and behaviour, hardware and software
        - Confocal microscopy, 3D histological registration
    - title: Computational methods
      items:
        - "Machine learning: clustering, semi-supervised learning, deep generative models (<a href=\"https://www.cell.com/cell/abstract/S0092-8674(25)00110-2\">Beau et al., 2025</a>)"
        - "Neural data analysis: spike sorting, spectral analysis, generalized linear models, dynamical systems"
        - Recurrent neural networks, dynamical systems
        - "Biophysical modelling: <a href=\"https://doi.org/10.1101/2022.03.07.483302\">NEURON</a> and BRIAN simulation environments"
        - "Programming: Python (open-source package development), MATLAB, Git"

