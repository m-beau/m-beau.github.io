- title: Summary
  contents: |
    <p class="font-weight-light">Postdoctoral researcher (HHMI, <a href="https://brodylab.org">Brody lab</a>, Princeton Neuroscience Institute) studying how brain-wide circuits and catecholaminergic neuromodulation implement attention control during context-dependent decision-making. I combine chronic recordings from up to 8 simultaneous Neuropixels probes in freely moving rats with optogenetics, pharmacology, and dynamical-systems models of multi-area population activity. During my PhD (UCL, Häusser lab), I co-discovered reward-predictive climbing fiber signals in the cerebellum (<a href="https://doi.org/10.1038/s41593-019-0381-8">Kostadinov et al., Nature Neuroscience, 2019</a>) and, as first author in an international collaboration, developed a semi-supervised deep-learning method that identifies neuron cell types across species (<a href="https://doi.org/10.1016/j.cell.2025.01.041">Beau et al., Cell, 2025</a>). I also develop open-source Neuropixels software (<a href="https://github.com/m-beau/NeuroPyxels">NeuroPyxels</a>, <a href="https://github.com/m-beau/pixelmap">PixelMap</a>; >200 GitHub stars combined) and co-founded the Princeton Neuroscience Institute Open Science award.</p>

